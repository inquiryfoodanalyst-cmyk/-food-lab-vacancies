<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Testing Lab Vacancies — India Live Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F4EC;
    --surface: #FFFFFF;
    --ink: #1E2A24;
    --teal: #2F6F5E;
    --teal-dim: #E4EEEA;
    --amber: #C97A2B;
    --amber-dim: #F5E6D3;
    --sage: #8B9A93;
    --hairline: #DDD8C8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .title-block h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .title-block p {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sage);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .live-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--teal);
    background: var(--teal-dim);
    padding: 6px 12px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--teal);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(47,111,94,0.4); }
    50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(47,111,94,0); }
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 6px 11px;
    border: 1px solid var(--hairline);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--teal);
    border-radius: 2px;
    padding: 14px 18px 14px 16px;
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 14px;
    align-items: start;
  }
  .card::after {
    content: "";
    position: absolute;
    top: -1px; right: -1px;
    width: 14px; height: 14px;
    background: var(--paper);
    border-left: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
  .spec-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    line-height: 1.5;
  }
  .spec-id b {
    display: block;
    color: var(--ink);
    font-size: 12.5px;
  }
  .card-body a {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    color: var(--ink);
    text-decoration: none;
    line-height: 1.35;
  }
  .card-body a:hover { color: var(--teal); text-decoration: underline; }
  .meta-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 7px;
    flex-wrap: wrap;
  }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 2px;
    background: var(--amber-dim);
    color: var(--amber);
  }
  .src {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
  }
  .empty, .loading {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--sage);
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed var(--hairline);
    border-radius: 3px;
  }
  footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--sage);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>Food Testing Lab Vacancies</h1>
      <p>Live sample log — India</p>
    </div>
    <div class="live-tag"><span class="dot"></span><span id="updated-text">Loading…</span></div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="feed" id="feed"><div class="loading">Pulling the latest samples…</div></div>

  <footer>Auto-refreshed from public news, job portal, and social listings · Refreshes every few hours</footer>
</div>

<script>
const DATA_URL = "vacancies.json"; // same-folder JSON produced by fetch_vacancies.py
let allItems = [];
let activeCategory = "All";

function timeAgo(pubDate) {
  if (!pubDate) return "";
  const d = new Date(pubDate);
  if (isNaN(d)) return "";
  const diffMs = Date.now() - d.getTime();
  const hrs = Math.floor(diffMs / 3600000);
  if (hrs < 1) return "just now";
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  return days + "d ago";
}

function render() {
  const feed = document.getElementById("feed");
  const items = activeCategory === "All" ? allItems : allItems.filter(i => i.category === activeCategory);
  if (!items.length) {
    feed.innerHTML = '<div class="empty">No listings in this category right now — check back soon.</div>';
    return;
  }
  feed.innerHTML = items.map((it, idx) => `
    <div class="card">
      <div class="spec-id">SPEC<b>#${String(idx + 1).padStart(4, "0")}</b></div>
      <div class="card-body">
        <a href="${it.link}" target="_blank" rel="noopener">${it.title}</a>
        <div class="meta-row">
          <span class="chip">${it.category}</span>
          <span class="src">${it.source} · ${timeAgo(it.published)}</span>
        </div>
      </div>
    </div>
  `).join("");
}

function renderFilters() {
  const cats = ["All", ...new Set(allItems.map(i => i.category))];
  document.getElementById("filters").innerHTML = cats.map(c =>
    `<button class="filter-chip ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</button>`
  ).join("");
  document.querySelectorAll(".filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      renderFilters();
      render();
    });
  });
}

fetch(DATA_URL, { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    allItems = data.items || [];
    document.getElementById("updated-text").textContent =
      "Updated " + new Date(data.generated_at).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    renderFilters();
    render();
  })
  .catch(() => {
    document.getElementById("updated-text").textContent = "Feed unavailable";
    document.getElementById("feed").innerHTML = '<div class="empty">Could not load vacancies.json — has fetch_vacancies.py run yet?</div>';
  });
</script>
</body>
</html>
