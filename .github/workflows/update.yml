name: Update vacancy feed

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest vacancies
        run: python3 fetch_vacancies.py

      - name: Commit updated feed
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          git add vacancies.json first_seen.json
          git diff --quiet --cached || git commit -m "Auto-update vacancy feed"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
